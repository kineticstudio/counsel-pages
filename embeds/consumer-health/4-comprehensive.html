 const root=document.currentScript.previousElementSibling;
 const deps=[["gsap","gsap"],["ScrollTrigger","ScrollTrigger"],["CustomEase","CustomEase"]];
 window.__counselCardGSAP=window.__counselCardGSAP||deps.reduce((chain,[key,file])=>chain.then(()=>window[key]||new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/"+file+".min.js";s.onload=resolve;s.onerror=reject;document.head.append(s);})),Promise.resolve());

    // A message lands the way the product's do: up and into place from its corner.
